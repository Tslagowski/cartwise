<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Cartwise</title>
  <meta name="theme-color" content="#0f6e56">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cartwise">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>try{document.documentElement.dataset.text=localStorage.getItem('textSize')||'default'}catch(e){}</script>
  <script>window.CARTWISE_VERSION = '0.4.3';</script>
</head>
<body>
  <header class="app-head">
    <h1 id="title">Groceries</h1>
    <div class="head-actions">
      <button id="add-btn" class="icon-btn round" aria-label="Add"></button>
      <button id="settings-btn" class="icon-btn round" aria-label="Settings"></button>
    </div>
  </header>
  <button id="backup-banner" class="banner" hidden>It’s been a while since your last backup. Tap to export.</button>
  <main id="main"></main>
  <nav id="tabs" class="tabs">
    <button data-tab="groceries"><span class="ti"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h11l2-8H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg></span>Groceries</button>
    <button data-tab="wishlist"><span class="ti"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></svg></span>Wishlist</button>
    <button data-tab="prices"><span class="ti"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg></span>Prices</button>
  </nav>
  <dialog id="sheet" class="sheet"></dialog>
  <dialog id="scanner" class="scanner"></dialog>
  <div id="toast" class="toast" role="status"></div>
  <datalist id="dl-products"></datalist>
  <datalist id="dl-brands"></datalist>
  <datalist id="dl-stores"></datalist>
  <datalist id="dl-categories"></datalist>
  <script type="module" src="src/app.js"></script>
</body>
</html>
